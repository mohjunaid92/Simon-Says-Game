<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Simon Game</h2>
    <h3> Press any key to start your Game</h3>
    <div class="simon">
        <div class="line-one">
            <div class="yellow btn" type="button" id="yellow">1</div>
            <div class="red btn" type="button" id="red">2</div>
        </div>
        <div class="line-two">
            <div class="purple btn" type="button" id="purple">3</div>
            <div class="green btn" type="button" id="green">4</div>
        </div>
    </div>
    <h3 id="score" style="color:red;"></h3>

    <script src="app.js"></script>
</body>

</html>
